name: CI

on:
  push:
    branches: [master]
    tags:     ['v*']
  pull_request:
    branches: [master]

jobs:
  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release -q

  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Test Core
        run: dotnet test tests/RemarkableTablet.Core.Tests/RemarkableTablet.Core.Tests.csproj -c Release

      - name: Build CLI
        run: dotnet build src/RemarkableTablet.Cli/RemarkableTablet.Cli.csproj -c Release -f net10.0

  release-windows:
    name: Release (Windows)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish CLI (NativeAOT)
        run: >
          dotnet publish src/RemarkableTablet.Cli
          -c Release -r win-x64 -f net10.0-windows
          -p:PublishAot=true
          -p:InvariantGlobalization=true
          -o publish/cli

      - name: Publish App (self-contained)
        run: >
          dotnet publish src/RemarkableTablet.App
          -c Release -r win-x64
          -p:SelfContained=true
          -o publish/app

      - name: Package CLI
        run: Compress-Archive -Path publish/cli/remtablet.exe -DestinationPath publish/remtablet-${{ github.ref_name }}-win-x64.zip
        shell: pwsh

      - name: Package App
        run: Compress-Archive -Path publish/app/* -DestinationPath publish/RemtabletApp-${{ github.ref_name }}-win-x64.zip
        shell: pwsh

      - name: Create GitHub Release and upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/remtablet-${{ github.ref_name }}-win-x64.zip
            publish/RemtabletApp-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true

  release-linux:
    name: Release (Linux)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install NativeAOT prerequisites
        run: sudo apt-get install -y clang zlib1g-dev

      - name: Publish CLI (NativeAOT)
        run: >
          dotnet publish src/RemarkableTablet.Cli
          -c Release -r linux-x64 -f net10.0
          -p:PublishAot=true
          -p:InvariantGlobalization=true
          -o publish/cli

      - name: Package CLI
        run: tar -czf publish/remtablet-${{ github.ref_name }}-linux-x64.tar.gz -C publish/cli remtablet

      - name: Upload Linux artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/remtablet-${{ github.ref_name }}-linux-x64.tar.gz
